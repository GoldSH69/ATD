name: 24/7 AutoThreads Bot

on:
  schedule:
    - cron: '0 17 * * *'   # 매일 새벽 02:00 KST 1회 일괄 포스트 창작 가동 (17:00 UTC)
  workflow_dispatch:


 # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run AutoThreads Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          npx tsx scripts/bot.ts

      - name: Commit and Push Logs / Config Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logs.json data/config.json data/used_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update logs and config [skip ci]" && git push)
