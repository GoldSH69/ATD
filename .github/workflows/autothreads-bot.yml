name: 24/7 AutoThreads Bot

on:
  schedule:
    - cron: '0 17 * * *'   # 02:00 KST: 하루 5개 포스트 일괄 창작 + Post #1 즉시 실시간 발행 (17:00 UTC)
    - cron: '30 23 * * *'  # 08:30 KST 출발 (3시간 딜레이 -> 목표 11:30 KST Post #2 발행)
    - cron: '0 3 * * *'    # 12:00 KST 출발 (3시간 딜레이 -> 목표 15:00 KST Post #3 발행)
    - cron: '0 6 * * *'    # 15:00 KST 출발 (3시간 딜레이 -> 목표 18:00 KST Post #4 발행)
    - cron: '0 9 * * *'    # 18:00 KST 출발 (3시간 딜레이 -> 목표 21:00 KST Post #5 발행)
  workflow_dispatch:



 # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run AutoThreads Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          npx tsx scripts/bot.ts

      - name: Commit and Push Logs / Config Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logs.json data/config.json data/used_articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update logs and config [skip ci]" && git push)
