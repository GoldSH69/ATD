name: 20-Min Periodic Scheduler & Auto-Reply Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # 20분 마다 가동되어 예약 포스트 발행 및 자동 답글 수행
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Periodic Scheduler & Auto-Reply Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          npx tsx scripts/scheduler.ts

      - name: Commit and Push Logs / Config Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logs.json data/drafts.json data/config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update scheduler logs and drafts [skip ci]" && git push)
