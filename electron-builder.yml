appId: com.jimmypark.autothreads
productName: AutoThreads
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
